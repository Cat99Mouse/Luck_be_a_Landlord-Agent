[project]
name = "lballm"
version = "0.1.0"
description = "LLM-powered Luck be a Landlord agent"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28.1",
  "jinja2>=3.1.6",
  "openai>=2.14.0",
  "pyyaml>=6.0.3",
  "lbalbot",
]

[project.scripts]
lballm = "lballm.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.uv.sources]
lbalbot = { path = "../lbalbot", editable = true }

[tool.ruff]
lint.extend-select = ["I"]
