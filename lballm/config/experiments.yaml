# Multi-model experiment runner config.
#
# Run from the lballm directory:
#   uv run python scripts/run_experiments.py --config config/experiments.yaml
#
# Preview without starting games:
#   uv run python scripts/run_experiments.py --config config/experiments.yaml --dry-run
#
# Force all runs to chatbot mode without editing this file:
#   uv run python scripts/run_experiments.py --config config/experiments.yaml --control-mode chatbot

base_config: local.yaml
runs_per_model: 3
# Metadata written to results.jsonl. Output directories are timestamped per run.
experiment_name: lballm-multi-model
logs_root: logs/experiments

# Optional shared overrides applied after base_config and before each model.
overrides:
  start_game: true
  start_action: new
  trace_enabled: true

# To compare control modes for the same model, add separate entries. If a
# chatbot entry leaves strategy as default, the runner normalizes it to chatbot.
#
#   - name: gpt-5.5-agent
#     provider: openai
#     model: gpt-5.5
#     control_mode: agent
#     strategy: default
#
#   - name: gpt-5.5-chatbot
#     provider: openai
#     model: gpt-5.5
#     control_mode: chatbot
#
models:
  - name: gpt-5.5
    provider: openai
    model: gpt-5.5
